# Harvest Moon: Back to Nature - native port configuration
# Lines starting with # or ; are comments. Remove the # in front of an option to change it.

[general]
# Your own copy of the game: a disc image (.cue or .bin) or a HarvestMoonBTN.pak data pack
# made from it. When not set (or not found), the game uses HarvestMoonBTN.pak next to the
# executable if there is one, otherwise the first .cue/.bin in the "disc" folder.
#disc = C:\Games\Harvest Moon - Back to Nature.cue

# Folder for the memory card file (card1.mcd, standard 128 KB raw format that DuckStation,
# ePSXe, etc. also use - you can copy an existing save card here).
#savedir = saves

[video]
# Initial window size as a multiple of 320x240.
scale = 3
# Internal rendering resolution: 1 = original 320x240. 2, 3 or 4 draws the 3D scenes at
# 640x480, 960x720 or 1280x960 for smoother edges (textures stay as they are); needs more CPU.
upscale = 1
# 1 = precise 3D vertex positions (PGXP): no wobbling polygons. Needs upscale 2 or more.
pgxp = 0
# 1 = perspective-correct textures: no warping on large polygons. Needs pgxp = 1.
perspective = 0
# 1 = 2D objects (stumps, rocks, people) get smaller further away, like the 3D ground under
# them, instead of keeping one size. Their pixels get slightly uneven. Needs pgxp = 1.
sprite_depth = 0
# Widescreen: off, 16:9, 16:10 or 21:9. The 3D view gets wider (more of the farm and town
# on screen); screens without 3D (title, menus, videos) stay 4:3. Text and menus over the 3D
# view are stretched. 2D objects and people keep their shape only with upscale 2 or more
# (sharpest with 4).
widescreen = off
# 1 = start in fullscreen (F11 or Alt+Enter toggles at any time).
fullscreen = 0
# How the picture is scaled to the window or screen:
#   sharp-bilinear  sharp pixels that stay even at any size (no shimmer when scrolling)
#   sharp           plain nearest pixel: uneven pixels unless the size is an exact multiple
#   smooth          bilinear, soft
scaling = sharp-bilinear
# 1 = 4:3 picture like a CRT TV, 0 = square pixels.
aspect43 = 1

[behaviour]
# 1 = allow holding Tab to fast-forward. 0 = disabled.
fastforward = 1
# 1 = shorter loading pauses (music streaming is unaffected). 0 = original timing.
fastcd = 0

[keyboard]
# Comma-separated key names (SDL names, e.g. Up, X, Space, Return, Left Shift, Keypad 8).
#key_up       = Up
#key_down     = Down
#key_left     = Left
#key_right    = Right
#key_cross    = X,Space,K
#key_circle   = Z,L
#key_square   = S,J
#key_triangle = A,I
#key_l1       = Q
#key_r1       = W
#key_l2       = 1
#key_r2       = 2
#key_start    = Return
#key_select   = Right Shift,Backspace

[controller]
# Xbox / XInput controller buttons (SDL names): a b x y back start guide leftshoulder
# rightshoulder leftstick rightstick dpup dpdown dpleft dpright lefttrigger righttrigger
#pad_cross    = a
#pad_circle   = b
#pad_square   = x
#pad_triangle = y
#pad_l1       = leftshoulder
#pad_r1       = rightshoulder
#pad_l2       = lefttrigger
#pad_r2       = righttrigger
#pad_start    = start
#pad_select   = back
#pad_up       = dpup
#pad_down     = dpdown
#pad_left     = dpleft
#pad_right    = dpright
# 1 = the left analog stick also works as the D-pad.
stick_as_dpad = 1
