# Publish the launchers as release v<VERSION> (VERSION in dist-template/launcher.pyw), built here from main:
# HarvestMoonBTN-Launcher.exe (Windows) and HarvestMoonBTN-Launcher-Linux. Players' launchers find the newest
# published release, update themselves and rebuild the game from their disc's files. The release holds only
# the launchers (their scripts and sources): nothing of the game.
# Run it from the Actions tab: Release launcher -> Run workflow (on main). With "Publish" off it only builds
# and tests both launchers (any branch), and keeps them as the run's artifacts.
name: Release launcher

on:
  workflow_dispatch:
    inputs:
      notes:
        description: What changed
        required: false
      draft:
        description: Draft (launchers ignore it until you publish it on the Releases page)
        type: boolean
        default: true
      publish:
        description: Make the release (off = only build and test both launchers)
        type: boolean
        default: true

permissions:
  contents: write       # the tag and the release
  id-token: write       # the build attestation
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      - run: python -m pip install pyinstaller==6.22.3

      - run: python tools/build_launcher.py

      - name: Check the version
        id: version
        env:
          PYINSTALLER_RESET_ENVIRONMENT: '1'
        run: |
          version=$(sed -n "s/^VERSION = '\([0-9.]*\)'.*/\1/p" dist-template/launcher.pyw)
          built=$(dist-template/HarvestMoonBTN-Launcher.exe --version)
          if [ "$built" != "$version" ]; then
            echo "::error::the built launcher says '$built', launcher.pyw says '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows
          path: dist-template/HarvestMoonBTN-Launcher.exe

  linux:
    # the oldest supported runner: a launcher built on an older glibc also runs on newer distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'

      # the runtime's unit tests, and every SDL call platform_sdl.c makes loaded by sdl_dyn.h
      # (on Linux SDL2 is loaded at runtime: a missing one fails the game's link)
      - run: python tools/run_tests.py

      # the launcher's window is Tk: PyInstaller packs it only if this Python has it
      - run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - run: python -m pip install pyinstaller==6.22.3

      - run: python tools/build_launcher.py

      - name: Check the version
        env:
          PYINSTALLER_RESET_ENVIRONMENT: '1'
        run: |
          mv dist-template/HarvestMoonBTN-Launcher dist-template/HarvestMoonBTN-Launcher-Linux
          version=$(sed -n "s/^VERSION = '\([0-9.]*\)'.*/\1/p" dist-template/launcher.pyw)
          built=$(dist-template/HarvestMoonBTN-Launcher-Linux --version)
          if [ "$built" != "$version" ]; then
            echo "::error::the built launcher says '$built', launcher.pyw says '$version'"; exit 1
          fi
          dist-template/HarvestMoonBTN-Launcher-Linux --selftest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: linux
          path: dist-template/HarvestMoonBTN-Launcher-Linux

  release:
    needs: [windows, linux]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: echo "::error::run this on main" && exit 1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: launchers
          merge-multiple: true

      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
             git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "v$VERSION" >/dev/null; then
            echo "::error::v$VERSION exists already (maybe as a draft): raise VERSION in launcher.pyw"; exit 1
          fi
          chmod +x launchers/HarvestMoonBTN-Launcher-Linux

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            launchers/HarvestMoonBTN-Launcher.exe
            launchers/HarvestMoonBTN-Launcher-Linux

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
          NOTES: ${{ inputs.notes }}
          DRAFT: ${{ inputs.draft }}
        run: |
          notes="${NOTES:-Launcher $VERSION.}"
          notes+=$'\n\n**Windows:** put HarvestMoonBTN-Launcher.exe in a folder and open it; its "Build from my disc" page makes the game from your own disc image.'
          notes+=$'\n**Linux:** put HarvestMoonBTN-Launcher-Linux in a folder, make it executable (chmod +x) and open it. Its build needs a C compiler and the SDL2 development package (e.g. sudo apt install build-essential libsdl2-dev; on Bazzite or other immutable systems, in a toolbox).'
          notes+=$'\nA launcher already in use updates itself.'
          notes+=$'\n\nBuilt by this workflow from '"$GITHUB_SHA"$'. Check a file: gh attestation verify FILE --repo '"$GITHUB_REPOSITORY"
          gh release create "v$VERSION" launchers/HarvestMoonBTN-Launcher.exe launchers/HarvestMoonBTN-Launcher-Linux \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Launcher v$VERSION" --notes "$notes" $([ "$DRAFT" = true ] && echo --draft)
